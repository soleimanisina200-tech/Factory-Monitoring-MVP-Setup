# =====================================================================================================================
# Factory monitoring - main settings (hand-edited; every key has a default in app/core/config.py, unknown keys are
# reported at start-up, wrong types stop the start-up with a clear message).
# Scene geometry (zones, lines, regions, doors) lives in configs/scene.yaml (written by the drawing tools).
# =====================================================================================================================

system:
  camera_id: cam1                 # written into every event (several cameras -> several instances / ids)
  device: cuda:0
  half_precision: true
  display_gui: true               # false (or --no-gui) for a headless service
  log_dir: logs                   # rotating log files
  log_level: INFO
  heartbeat_path: logs/heartbeat.json   # status written every 5 s (watchdog / monitoring)
  max_consecutive_errors: 100     # failing frames in a row before the process gives up (supervisor restarts it)

stream:
  source: data/input/test_video.mp4     # file, rtsp://user:pass@ip:554/..., or camera index; --source overrides
  drop_frames_on_lag: true        # live: always process the newest frame
  rtsp_transport: tcp             # tcp avoids the grey smearing of lost UDP packets
  reconnect_delay_sec: 3.0        # first reconnect delay (doubles up to max_reconnect_delay_sec)
  max_reconnect_delay_sec: 30.0
  read_timeout_sec: 5.0
  max_stall_sec: 0                # >0: give up (exit / restart) after this long without frames; 0 = wait forever
  recording_start_time: ""        # video FILES only: real start time of the clip, e.g. "2026-11-17 08:00:00"

recording:
  output_video_path: auto         # auto = outputs/<video name>_annotated.mp4 (live: outputs/<camera>_live.mp4);
                                  # or an explicit path; empty = no annotated video. --output overrides per run
  segment_minutes: 0              # 0 = one file (clips); e.g. 15 for a live camera (rotating files)
  max_segments: 96                # segments kept (15 min x 96 = 24 h)

detection:
  model_weights: yolo11m-pose.pt  # yolo11l-pose.pt / yolo11x-pose.pt: more accurate, slower
  tracker_config: configs/custom_bytetrack.yaml   # or configs/trackers/factory_{ocsort,deepocsort,tracktrack}.yaml
  conf_thres: 0.08
  iou_thres: 0.6
  imgsz: 1536

reid:
  model_name: osnet_x1_0          # osnet_ain_x1_0 generalises better to new sites (manual weights, see README)
  weights_path: weights/osnet_x1_0_msmt17.pt
  kpt_conf_thresh: 0.2
  min_laplacian_var: 10.0
  # Uniforms: colour carries little identity, the head/upper body carries more. For an all-uniform site try
  # head_branch_weight 0.45 and color_branch_weight 0.10 (re-check with the comparison procedure of the README).
  head_branch_weight: 0.35
  color_branch_weight: 0.2
  cos_sim_thresh: 0.6
  spatial_recovery_sim_thresh: 0.48
  reentry_sim_thresh: 0.82        # MINIMUM similarity to give an ID back to a returning worker (see open_set)
  reid_interval_sec: 0.35
  stitch_sim_thresh: 0.55
  stitch_margin: 0.04
  reentry_min_gap_sec: 2.0
  reentry_margin: 0.08
  reentry_min_samples: 3
  recover_strict_after_sec: 8.0  # hidden longer than this inside the scene -> open-set threshold applies too
  emerge_wait_sec: 2.0            # new track where a hidden worker could come out: wait for clean crops before a NEW ID
  exit_confirm_sec: 0.8
  exit_edges: [left, right, top, bottom]   # image edges that are real ways out
  mismatch_min_span_sec: 1.0
  min_gallery_height_px: 72
  min_visible_kpts: 5
  anchor_min_height_px: 110
  track_state_ttl_sec: 10.0
  identity_retention_sec: 43200   # remember workers who left for 12 h (lunch, shift breaks)
  max_exited_identities: 500
  occlusion_max_sec: 300.0        # hidden inside the scene (behind a truck, loading) this long before "left"
  border_margin_ratio: 0.06
  pool_max_samples: 8
  pool_window_sec: 4.0
  track_gap_reset_sec: 1.5
  decision_log_path: logs/identity_decisions.jsonl
  open_set:                       # learns how similar DIFFERENT workers look at this site (uniforms!)
    enabled: true
    quantile: 0.995               # re-entry threshold >= this quantile of impostor similarities + margin
    margin: 0.03
    min_samples: 60
    max_threshold: 0.95
    sample_interval_sec: 1.0
  stature:                        # relative body height (learned per camera, no calibration): clearly different
    enabled: true                 # height = different people, whatever the uniform. Similar height proves nothing.
    min_diff: 0.05                # relative difference needed (~8-9 cm)
    min_samples: 8                # upright full-body measurements before a person's height is used
    model_min_samples: 150        # measurements before the camera's height model is trusted
    sample_interval_sec: 0.25
  persistence:                    # identities survive restarts (IDs do not restart at 1)
    mode: auto                    # auto = live cameras only | on | off
    dir: data/identity_store
    save_interval_sec: 60

markers:                          # optional helmet ArUco markers = hard identity (configs/workers.yaml)
  enabled: false
  registry_path: configs/workers.yaml
  dictionary: DICT_4X4_50
  accept_unregistered: false
  read_interval_sec: 0.5
  min_votes: 2
  vote_window_sec: 4.0
  min_person_height_px: 120

# Ground calibration: configs/calibration.yaml (scripts/calibrate_ground_plane.py) is used when present.
physics_bev:
  max_worker_speed_mps: 3.5
  max_internal_occlusion_m: 15.0  # length of the largest occluder: walk behind a truck at one end, out at the other
  lag_diffusion_coeff: 0.65
  base_pose_jitter_m: 0.7
  default_px_per_meter: 110.0

scene:
  path: configs/scene.yaml

zones:
  entry_confirm_sec: 0.5
  exit_confirm_sec: 1.0
  lost_timeout_sec: 15.0          # not visible this long while inside -> visit closed (LOST)
  include_unverified: true        # count people before their ID is confirmed (attributed later)

crossings:
  dead_band_px: 18.0              # foot-point jitter band around a line (scaled per line by the scene file)
  cooldown_sec: 1.0
  max_gap_sec: 4.0                # a crossing hidden by an occlusion up to this long still counts
  segment_margin: 0.10
  region_exit_confirm_sec: 0.3
  region_lost_sec: 3.0
  draw_trails: true

attribution:
  timeout_sec: 20.0               # events of a not-yet-identified person wait this long for the worker ID
  record_unidentified: true

events:
  db_path: data/factory_events.db
  csv_dir: data/events
  snapshot_dir: data/snapshots
  snapshot_event_types: []        # alarms always get a snapshot; add e.g. [WRONG_WAY, ZONE_DWELL_EXCEEDED]
  retention_days: 90              # snapshots / CSV mirrors older than this are deleted (the database is kept)

alarms:
  enable_audio_alarm: true
  alarm_cooldown_sec: 5.0         # rate limit of the OUTPUTS only - every alarm is always recorded
  audio_frequency_hz: 2200
  audio_duration_ms: 400
  forward_min_severity: alarm     # alarm | warning | info
  webhook_urls: []                # e.g. [http://siren-gateway.local/api/alarm]
  webhook_headers: {}
  webhook_timeout_sec: 3.0
  mqtt: {enabled: false, host: 127.0.0.1, port: 1883, topic: factory/alarms, username: "", password: ""}

# Several cameras: do NOT copy this file per camera. List the cameras in configs/cameras.yaml (see
# configs/cameras.example.yaml) and start them with run_multi_camera.py; the cross_camera settings live there.

web:
  enabled: false                  # /api/status /api/telemetry /api/events /video_feed
  host: 127.0.0.1                 # 0.0.0.0 only behind a protected network / reverse proxy
  port: 8050
  token: ""                       # set a token to require ?token=... on every request
  stream_max_fps: 10
  stream_width: 1280
