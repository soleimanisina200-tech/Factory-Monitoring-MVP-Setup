system: {device: 'cuda:0', half_precision: true, display_gui: true, output_video_path: output_industrial_reid.mp4}
stream: {source: 'data/input/test_video.mp4',  # override with: python main.py --source <path|rtsp://...>
  reconnect_delay_sec: 3.0, drop_frames_on_lag: true}
detection: {model_weights: yolo11m-pose.pt, tracker_config: configs/custom_bytetrack.yaml,
  conf_thres: 0.08, iou_thres: 0.6, imgsz: 1536}
reid: {model_name: osnet_x1_0, weights_path: weights/osnet_x1_0_msmt17.pt, kpt_conf_thresh: 0.2,
  min_laplacian_var: 10.0, head_branch_weight: 0.35, color_branch_weight: 0.2, cos_sim_thresh: 0.6,
  spatial_recovery_sim_thresh: 0.48, reentry_sim_thresh: 0.82, reid_interval_sec: 0.35,
  # --- identity safety (a wrong merge is worse than a fresh ID) ---
  stitch_sim_thresh: 0.55,      # in-place tracklet stitching (was a hard-coded 0.42)
  stitch_margin: 0.04,          # best-vs-runner-up gap (runner-up includes workers currently on screen)
  reentry_min_gap_sec: 2.0,     # a worker who just left needs +0.08 extra similarity to return sooner
  reentry_margin: 0.08,         # best-vs-runner-up gap required to give an EXITED identity back
  reentry_min_samples: 3,       # clean multi-frame samples required before an EXITED identity is reused
  exit_confirm_sec: 0.8,        # absence before a worker who walked OUT through a border counts as EXITED
  exit_edges: [left, right, top, bottom],   # image edges that are real ways out (drop e.g. 'top' for a far wall)
  mismatch_min_span_sec: 1.0,   # appearance mismatch must persist this long before a binding is broken
  min_gallery_height_px: 72,    # smaller crops are matched but never stored in a worker's appearance memory
  min_visible_kpts: 5,          # ... same for crops with fewer visible joints
  anchor_min_height_px: 110,    # permanent anchors need an even larger crop
  track_state_ttl_sec: 10.0,    # memory bound: forget dead tracker ids after this long
  identity_retention_sec: 3600, # memory bound: forget workers who left more than 1 h ago ...
  max_exited_identities: 300,   # ... and keep at most this many departed workers
  occlusion_max_sec: 20.0,      # longest in-scene occlusion before the identity is treated as EXITED
  border_margin_ratio: 0.06,
  track_gap_reset_sec: 1.5,     # a track id missing this long and then reappearing is treated as brand new
  decision_log_path: logs/identity_decisions.jsonl}   # one JSON line per identity decision (empty = off)
# Ground calibration: configs/calibration.yaml (scripts/calibrate_ground_plane.py) takes precedence.
# The src_image_pts below are only a placeholder fallback; calibration_ref_wh = resolution they were picked at.
physics_bev:
  max_worker_speed_mps: 3.5
  max_internal_occlusion_m: 5.5
  lag_diffusion_coeff: 0.65
  base_pose_jitter_m: 0.7
  default_px_per_meter: 110.0
  calibration_ref_wh: [1280, 720]
  src_image_pts:
  - [320, 280]
  - [960, 280]
  - [1180, 680]
  - [100, 680]
  dst_meter_pts:
  - [0.0, 0.0]
  - [6.0, 0.0]
  - [6.0, 8.0]
  - [0.0, 8.0]
zones:
  entry_confirm_sec: 0.5
  exit_confirm_sec: 1.0
  force_exit_timeout_sec: 15.0
  definitions: {}
