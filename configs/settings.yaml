# Factory Monitoring MVP Configuration

system:
  project_name: "Industrial CV Factory Monitoring"
  version: "0.1.0"
  debug: true

hardware:
  device: "cuda:0"  # Will fallback to 'cpu' if cuda is unavailable

# Placeholders for future phases
detection:
  model_path: "yolov11s.pt"
  confidence_threshold: 0.4
  classes: [0] # 0 = person in COCO dataset

tracking:
  tracker_type: "bytetrack"
  track_buffer: 45

zones:
  - id: "machine_01"
    name: "Machine 01"
    polygon:
      - [672, 291]
      - [1649, 751]
      - [337, 962]
      - [119, 483]

events:
  # How many consecutive frames an object must be inside to trigger a confirmed ENTRY
  entry_confirmation_frames: 10
  # How many consecutive frames an object must be outside to trigger a confirmed EXIT
  exit_confirmation_frames: 15

fuse_score: True