stream:
  source: "D:/AI/EsfahanMoghadam/Factory Monitoring MVP Setup/data/input/test_video.mp4" # مسیر فایل ویدیویی یا آدرس استریم RTSP
  width: 1280
  height: 720
  fps: 25
  reconnect_delay: 3.0

detection:
  model_path: "yolo11m-pose.pt"      # مدل YOLO-Pose برای استخراج همزمان باکس و ۱۷ مفصل اسکلت
  conf_threshold: 0.40
  iou_threshold: 0.50
  device: "cuda"
  tracker_config: "configs/custom_bytetrack.yaml"

reid:
  model_name: "osnet_ain_x1_0"       # مدل مقاوم به تغییرات نور و استایل (با Fallback خودکار به osnet_x1_0)
  device: "cuda"
  similarity_threshold: 0.68         # آستانه پایه تطبیق کسینوسی پس از حذف میانگین لباس فرم
  margin_threshold: 0.06             # حداقل اختلاف شباهت نفر اول با نفر دوم (قانون Margin برای لباس فرم یکسان)
  reverify_sim_floor: 0.52           # کف شباهت برای حفظ قفل ترک در فریم‌های بعدی
  max_gallery_size: 8                # حداکثر بردار ذخیره‌شده به ازای هر باکت زاویه دید
  probation_frames: 4                # تعداد فریم‌های سالم لازم قبل از صدور Worker_ID دائمی
  reid_interval_frames: 10           # فاصله فریم‌ها برای بازبینی دوره‌ای ترک‌های قفل‌شده
  track_ttl_sec: 180.0               # زمان پاکسازی خودکار ترک‌های قدیمی از حافظه (جلوگیری از Memory Leak)
  border_cooldown_sec: 3.5           # زمان محافظت از آیدی کارگر خارج‌شده از لبه کادر
  max_speed_px_per_sec: 450.0        # حداکثر سرعت مجاز حرکت انسان در تصویر (Kinematic Gate)
  uniform_whitening_alpha: 0.55      # ضریب حذف بردار میانگین لباس فرم کارخانه (Feature Centering)
  part_weights:
    head: 0.55                       # بیشترین وزن برای ناحیه سر، صورت، گردن و کلاه
    shoes: 0.30                      # وزن دوم برای ساق پا و کفش ایمنی
    torso: 0.15                      # کمترین وزن برای تنه (خنثی‌سازی اثر لباس فرم یکسان)

geometry:
  border_margin_px: 28               # حاشیه تشخیص چسبیدن باکس به لبه تصویر (پیکسل)
  occlusion_ioa_threshold: 0.18      # آستانه مساحت اشتراک به مساحت سوژه عقب‌تر (IoA)
  min_keypoint_conf: 0.45            # حداقل اطمینان مفاصل اسکلت
  homography_src: []                 # در صورت نیاز: ۴ نقطه پیکسلی کف سالن [[x1,y1], [x2,y2], [x3,y3], [x4,y4]]
  homography_dst: []                 # در صورت نیاز: ۴ نقطه متریک متناظر [[0,0], [W,0], [W,H], [0,H]]

state_machine:
  entry_frames: 8                    # حداقل فریم برای تایید ورود
  exit_frames: 12                    # حداقل فریم برای تایید خروج
  entry_confirm_sec: 0.32            # زمان تایید ورود بر حسب ثانیه (مستقل از افت FPS)
  exit_confirm_sec: 0.48             # زمان تایید خروج بر حسب ثانیه (مستقل از افت FPS)
  timeout_sec: 4.0                   # زمان غیبت برای صدور رویداد FORCE_EXIT

zones:
  Zone_Assembly:
    - [150, 220]
    - [580, 220]
    - [640, 650]
    - [100, 650]
  Zone_Packaging:
    - [660, 220]
    - [1120, 220]
    - [1180, 650]
    - [660, 650]

output:
  save_video: true
  output_video_path: "output_monitored.mp4"
  events_csv_path: "zone_events_log.csv"
  show_display: true