# configs/settings.yaml
system:
  device: "cuda:0"
  half_precision: true
  display_gui: true
  output_video_path: "output_industrial_reid.mp4"

stream:
  source: "D:/AI/EsfahanMoghadam/Factory Monitoring MVP Setup/data/input/test_video.mp4"
  reconnect_delay_sec: 3.0
  drop_frames_on_lag: true

detection:
  model_weights: "yolo11m-pose.pt"
  tracker_config: "configs/custom_bytetrack.yaml"
  conf_thres: 0.15        # Low pre-filter so ByteTrack sees all mid-ground & distant humans
  iou_thres: 0.55
  imgsz: 1280             # High-res 1280 inference required for 2560x1920 wide-angle scenes

reid:
  model_name: "osnet_x1_0"
  weights_path: "weights/osnet_x1_0_msmt17.pt"
  kpt_conf_thresh: 0.30   # Tolerates profile views and distant skeletons
  min_laplacian_var: 18.0 # Evaluated at native crop resolution (no upscaling blur)
  head_branch_weight: 0.35
  color_branch_weight: 0.20
  cos_sim_thresh: 0.64
  spatial_recovery_sim_thresh: 0.56
  reentry_sim_thresh: 0.78 # Strict threshold required to resurrect an exited Global ID
  reid_interval_sec: 0.35

physics_bev:
  max_worker_speed_mps: 2.6
  max_internal_occlusion_m: 3.5 # Caps in-scene occlusion jump radius so exited IDs cannot teleport
  lag_diffusion_coeff: 0.50
  base_pose_jitter_m: 0.55
  default_px_per_meter: 110.0
  # Reference resolution for calibration points (auto-scales to 2560x1920 if calibrated on 1280x720)
  calibration_ref_wh: [1280, 720]
  src_image_pts: [[320, 280], [960, 280], [1180, 680], [100, 680]]
  dst_meter_pts: [[0.0, 0.0], [6.0, 0.0], [6.0, 8.0], [0.0, 8.0]]

zones:
  entry_confirm_sec: 0.50
  exit_confirm_sec: 1.00
  force_exit_timeout_sec: 15.0
  definitions:
    Zone_A_Assembly:
      polygon: [[150, 300], [600, 300], [650, 680], [100, 680]]
    Zone_B_CNC_Press:
      polygon: [[680, 300], [1150, 300], [1220, 680], [680, 680]]