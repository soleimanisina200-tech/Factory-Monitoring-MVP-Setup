# # configs/custom_bytetrack.yaml
# tracker_type: bytetrack

# # Balanced thresholds: high recall for distant workers without spawning ghost boxes on limbs
# track_high_thresh: 0.28   # Primary association stage
# track_low_thresh: 0.10    # Secondary recovery stage for occluded/bending workers
# new_track_thresh: 0.32    # Prevents low-confidence partial-body ghost boxes from spawning tracks

# # Long-horizon Kalman buffer so ByteTrack bridges brief crouches and box-lifting occlusions natively
# track_buffer: 150         # 7.5 seconds @ 20 FPS
# match_thresh: 0.82        # Generous IoU association to prevent tracklet splitting during rapid bending
# fuse_score: true


tracker_type: bytetrack
track_high_thresh: 0.15   # Catches distant 40px humans at the top of the 2560x1920 yard
track_low_thresh: 0.05    # Keeps tracks alive during partial occlusion behind pallets/forklift
new_track_thresh: 0.18    # = the detector's minimum for new (non-tracked) people; lower only creates orphan tracks
# track_buffer is counted in PROCESSED frames, not seconds: 120 frames = 6 s at 20 FPS but 12-24 s at 5-10 FPS.
# Long-lost tracks are re-verified by the identity manager (gap > 1.5 s => treated as a new track), so a long
# buffer can no longer hand an old ID to a newcomer; shorten it if the effective processing FPS is low.
track_buffer: 120
match_thresh: 0.82
fuse_score: True