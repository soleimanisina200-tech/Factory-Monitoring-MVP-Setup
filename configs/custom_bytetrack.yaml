# configs/custom_bytetrack.yaml
tracker_type: bytetrack

# Confidence thresholds for two-stage association
track_high_thresh: 0.45   # First-stage high-confidence detections
track_low_thresh: 0.15    # Second-stage low-confidence recovery (occluded workers)
new_track_thresh: 0.55    # Strict threshold to prevent spawning ghost tracks during intersections

# Temporal & IoU association parameters
track_buffer: 90          # Number of frames to retain lost tracks
match_thresh: 0.75        # Stricter IoU gate to reduce ID swaps when workers cross paths
fuse_score: true          # Fuse detection confidence with IoU distance