# =====================================================================================================================
# Forklift & driver safety module. All times are SECONDS (independent of the processing frame rate).
# =====================================================================================================================
vehicle_monitoring:
  enabled: true

  # ---- detection ----------------------------------------------------------------------------------------------------
  # A COCO model has NO forklift class (truck = 7 is only a stand-in). For production, fine-tune a model on images of
  # THIS site's forklifts (a -seg model is used automatically: its mask gives the chassis edge on the floor) and set:
  #   vehicle_detector_weights: weights/forklift_yolo11m-seg.pt
  #   vehicle_class_names: [forklift]
  vehicle_detector_weights: yolo11m.pt
  vehicle_class_names: []            # selected by name from the model (preferred)
  vehicle_class_ids: [7]             # ... or by id
  person_class_id: 0                 # standalone runner only
  vehicle_conf_threshold: 0.40
  person_conf_threshold: 0.45
  vehicle_tracker_config: bytetrack.yaml
  vehicle_imgsz: 1280
  vehicle_half: true
  vehicle_detect_every_n_frames: 1   # 2-3 halves/thirds the cost (boxes reused in between)

  # ---- who is the driver --------------------------------------------------------------------------------------------
  pairing:
    cab_shrink: 0.08                 # cab region = vehicle box shrunk by this fraction left/right
    cab_score_threshold: 0.5
    # WHO IS IN THE CAB. Overlapping boxes are not enough (the box of a forklift also covers people standing metres
    # behind or in front of it), so the floor decides: feet visible in a standing pose = on the floor, not an
    # operator; feet hidden = seated in the cab OR standing right behind it - told apart by the seated pose (thighs
    # level with the hips) and by where the body stands relative to the forklift's floor footprint.
    operator_stands: false           # true for stand-up trucks (the operator stands on a platform: no seated pose)
    seated_knee_drop: 0.45           # knee below hip / torso length under this = seated
    cab_outside_gap_m: 0.45          # body this far beyond the footprint = standing behind the forklift
    cab_inside_gap_m: 0.10           # body this far inside the footprint = proof of being in the cab
    board_confirm_sec: 1.5           # parked vehicle: PROVEN in the cab this long -> driver
    seated_board_confirm_sec: 0.6    # ... clearly seated pose
    ambiguous_board_confirm_sec: 0   # legs hidden and NO proof of being inside: never the driver of a parked
                                     # forklift (0). He is bound, back-dated, as soon as he travels with it.
                                     # Set e.g. 8 to accept him after that many seconds anyway.
    moving_board_confirm_sec: 0.4    # moving vehicle: person travelling WITH it this long -> driver
    dismount_confirm_sec: 0.6        # driver out of the cab this long -> DRIVER_EXITED
    max_boarding_walk_speed_mps: 0.6 # faster people are passing by, not boarding
    vehicle_motion_threshold_m: 0.40 # displacement within motion_window_sec that means "moving"
    motion_window_sec: 1.0
    stop_confirm_sec: 1.5
    # "Travels with the forklift" = while it travels, his floor point stays inside its footprint (a forklift pivots:
    # comparing the two movements would see a seated driver "left behind" on every turn).
    comotion_min_travel_m: 0.6       # the forklift must have travelled this far before it is judged
    comotion_inside_gap_m: 0.15      # still inside the footprint (small tolerance) = travelling with it
    comotion_outside_gap_m: 1.0      # this far outside = left behind
    moved_without_driver_m: 1.0      # forklift travelled this far after its driver got out -> somebody else drives
    # roofed cabs (driver hidden): see README section "roofed forklifts"
    board_vanish_radius_m: 1.2       # a person vanishing this close to a forklift may have climbed in
    board_side_radius_m: 0.75        # ... and certainly did when he stood this close, in front of / beside it
                                     # (not behind it, where he may simply be hidden) just before
    vanish_min_sec: 0.8              # unseen this long = vanished (a missed detection is not)
    vanish_board_window_sec: 30.0    # ... if the forklift starts moving within this time
    hidden_board_confirm_sec: 2.0    # vanished INSIDE the cab region and stayed hidden this long -> onboard
    dismount_spawn_radius_m: 1.5     # a NEW person appearing this close to a parked occupied forklift = its driver
    emergence_window_sec: 1.5
    require_vehicle_activity_for_spawn: true
    recent_activity_sec: 120.0
    allow_provisional_ids_for_spawn: false
    spawn_border_margin_px: 40
    unknown_occupancy_timeout_sec: 120.0
    driver_handover_iou: 0.5         # tracker id switch on the same body keeps the driver
    driver_handover_max_gap_sec: 1.0
    unassigned_ghost_timeout_sec: 3.0
    assigned_ghost_timeout_sec: 30.0
    person_history_ttl_sec: 60.0
    session_timeout_sec: 900.0       # driver away this long -> session closed (seat-time report)
    # alarm POLICY - confirm with the site safety officer:
    alarm_on_driver_left_view: true  # dismounted driver walked out of the camera = unattended forklift
    driver_lost_alarm_sec: 0.0       # dismounted driver invisible NEXT to the forklift this long -> alarm (0 = off)

  # ---- distance ----------------------------------------------------------------------------------------------------
  distance:
    safe_distance_threshold_m: 3.0   # alarm when the dismounted driver is farther than this from the forklift
    warning_distance_threshold_m: 2.0
    alarm_confirm_sec: 1.0           # ... for at least this long (no flicker alarms)
    alarm_clear_sec: 2.0             # back within (threshold - hysteresis) this long -> alarm cleared
    clear_hysteresis_m: 0.3
    uncertain_margin_m: 1.5          # feet hidden: alarm only beyond threshold + this margin; never cleared
    # REAL SIZE of the site's forklifts: the floor footprint is a rectangle of this size fitted to the lower outline
    # of the segmentation mask. Measure one forklift (length WITH forks).
    vehicle_length_m: 3.4
    vehicle_width_m: 1.25
    vehicle_depth_m: 2.5             # only without calibration: footprint depth behind the visible bottom edge
    min_ankle_confidence: 0.30
    ema_smoothing_alpha: 0.35
    max_step_jump_m: 1.8
    min_bbox_aspect_ratio: 1.15
    border_margin_px: 12

  # Fallback calibration for the standalone runner only (configs/calibration.yaml is preferred everywhere).
  calibration:
    image_points_px: [[320, 380], [960, 380], [1180, 680], [100, 680]]
    world_points_m: [[0.0, 0.0], [6.0, 0.0], [6.0, 8.0], [0.0, 8.0]]
    fallback_meters_per_pixel: 0.012

  dashboard:
    draw_footprint: true             # draw the estimated floor footprint of each forklift
